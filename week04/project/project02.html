<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="project02.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="card-container">
    <!-- Банер болон вектор зургууд -->
    <div class="card-banner">
      <img src="Vector 3.svg" class="vector vector-3" alt="">
      <img src="Vector 6.svg" class="vector vector-6" alt="">
    </div>

    <!-- Профайл зураг -->
    <div class="profile-avatar">
      <img src="e056145289e90ad41ece0a85660d8c737b4d5a8d (3).png" alt="Johnny Rogers">
    </div>

    <!-- Агуулга -->
    <div class="card-content">
      <h1 class="user-name">Johnny Rogers</h1>
      <p class="user-handle">@jonnyrogers</p>

      <div class="social-icons">
        <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="icon"><i class="fa-brands fa-dribbble"></i></a>
      </div>

      <p class="user-bio">
        Crafting brand and communication strategies, creating visual designs, leading art direction, and capturing portraits through photography.
      </p>

      <div class="action-buttons">
        <button class="btn btn-primary">Follow</button>
        <button class="btn btn-outline">Message</button>
      </div> 
    </div>
  </div>

</body>
</html>
